<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Manodaya Homes — homestay booking income tracker">
  <meta name="theme-color" content="#1a5c3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manodaya">
  <title>Manodaya Homes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="header">
    <div class="header-brand">
      <div class="header-logo-wrap" aria-hidden="true">
        <svg class="header-logo-svg" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
          <rect width="44" height="44" fill="#1a5c3a"/>
          <polygon points="22,8 8,22 36,22" fill="#e8ddd0"/>
          <rect x="12" y="22" width="20" height="14" rx="2" fill="#faf9f5"/>
          <rect x="19" y="27" width="6" height="9" rx="1" fill="#7a3010"/>
          <rect x="14" y="25" width="5" height="5" rx="1" fill="#edf7f1" stroke="#1a5c3a" stroke-width="0.75"/>
          <rect x="25" y="25" width="5" height="5" rx="1" fill="#edf7f1" stroke="#1a5c3a" stroke-width="0.75"/>
        </svg>
      </div>
      <div class="header-text">
        <h1 class="header-title">Manodaya Homes</h1>
        <p class="header-sub">Homestay income tracker</p>
      </div>
    </div>
    <div class="sync-status">
      <span id="sync-dot" class="sync-dot" aria-hidden="true"></span>
      <span id="sync-label" class="sync-label">Synced</span>
    </div>
  </header>

  <main class="main">
    <!-- Entry -->
    <section id="screen-entry" class="screen screen-active" aria-label="New booking">
      <div class="screen-head">
        <h2 class="screen-title">New booking</h2>
        <p class="screen-desc">Record a guest stay and payment</p>
      </div>

      <form id="entry-form" class="entry-form" novalidate>
        <div class="form-card">
          <h3 class="form-card-title"><i class="ti ti-user" aria-hidden="true"></i> Who &amp; how</h3>

          <div class="field-row">
            <div class="field">
              <label class="field-label" for="booker">Booked by</label>
              <select class="field-select" id="booker" name="booker" required>
                <option value="Virender Rana">Virender Rana</option>
                <option value="Rakesh Rana">Rakesh Rana</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="type">Booking type</label>
              <select class="field-select" id="type" name="type">
                <option value="online">Pre-book</option>
                <option value="walkin">Walk-in</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="guest">Guest name</label>
            <input class="field-input" type="text" id="guest" name="guest" required autocomplete="name" placeholder="Full name">
            <p class="field-error" id="guest-error" hidden></p>
          </div>

          <div class="field">
            <label class="field-label" for="contact">Contact</label>
            <input class="field-input" type="tel" id="contact" name="contact" autocomplete="tel" placeholder="Phone number">
          </div>
        </div>

        <div class="form-card">
          <h3 class="form-card-title"><i class="ti ti-bed" aria-hidden="true"></i> Stay details</h3>

          <div class="field">
            <label class="field-label" for="room">Room</label>
            <select class="field-select" id="room" name="room"></select>
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field-label" for="checkin">Check-in</label>
              <input class="field-input" type="date" id="checkin" name="checkin" required>
            </div>
            <div class="field">
              <label class="field-label" for="checkout">Check-out</label>
              <input class="field-input" type="date" id="checkout" name="checkout" required>
            </div>
          </div>
        </div>

        <div class="form-card">
          <h3 class="form-card-title"><i class="ti ti-currency-rupee" aria-hidden="true"></i> Payment</h3>

          <div class="field-row">
            <div class="field">
              <label class="field-label" for="amount">Room amount ₹</label>
              <input class="field-input field-input--amount" type="number" id="amount" name="amount" required min="0" step="1" inputmode="numeric" placeholder="0">
              <p class="field-error" id="amount-error" hidden></p>
            </div>
            <div class="field">
              <label class="field-label" for="payment">Payment mode</label>
              <select class="field-select" id="payment" name="payment">
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Card">Card</option>
                <option value="Bank Transfer">Bank Transfer</option>
              </select>
            </div>
          </div>

          <div class="field field-checkbox">
            <label class="checkbox-label">
              <input type="checkbox" id="hasFood" name="hasFood">
              <span class="checkbox-box" aria-hidden="true"><i class="ti ti-check"></i></span>
              <span class="checkbox-text">Food included?</span>
            </label>
          </div>

          <div id="food-fields" class="food-fields" hidden>
            <div class="field-row">
              <div class="field">
                <label class="field-label" for="foodAmount">Food amount ₹</label>
                <input class="field-input" type="number" id="foodAmount" name="foodAmount" min="0" step="1" inputmode="numeric" placeholder="0">
              </div>
              <div class="field">
                <label class="field-label" for="foodBill">Bill no.</label>
                <input class="field-input" type="text" id="foodBill" name="foodBill" placeholder="Bill number">
              </div>
            </div>
          </div>
        </div>

        <div class="form-card form-card--flat">
          <div class="field">
            <label class="field-label" for="notes">Notes <span class="field-optional">(optional)</span></label>
            <input class="field-input" type="text" id="notes" name="notes" placeholder="Any notes">
          </div>
        </div>

        <button type="submit" id="save-btn" class="btn btn-save">Save Booking</button>
      </form>

      <div id="success-toast" class="success-toast" hidden role="status" aria-live="polite"></div>
    </section>

    <!-- Ledger -->
    <section id="screen-ledger" class="screen" aria-label="Booking ledger" hidden>
      <div class="screen-head">
        <h2 class="screen-title">Ledger</h2>
        <p class="screen-desc">All bookings, newest first</p>
      </div>
      <div id="ledger-list" class="ledger-list"></div>
    </section>

    <!-- Summary -->
    <section id="screen-summary" class="screen" aria-label="Income summary" hidden>
      <div class="screen-head">
        <h2 class="screen-title">Summary</h2>
        <p class="screen-desc">Income at a glance</p>
      </div>

      <div class="summary-hero">
        <p class="summary-label">Today's income</p>
        <p id="summary-today" class="summary-today">₹0</p>
      </div>

      <div class="summary-card">
        <p class="summary-label">This month</p>
        <p id="summary-month" class="summary-month">₹0</p>
      </div>

      <div class="summary-split">
        <div class="stat-box stat-box--online">
          <i class="ti ti-calendar-check stat-icon" aria-hidden="true"></i>
          <p class="stat-label">Pre-book</p>
          <p id="summary-online" class="stat-value">₹0</p>
        </div>
        <div class="stat-box stat-box--walkin">
          <i class="ti ti-door-enter stat-icon" aria-hidden="true"></i>
          <p class="stat-label">Walk-in</p>
          <p id="summary-walkin" class="stat-value">₹0</p>
        </div>
      </div>

      <div class="summary-card">
        <h2 class="summary-heading">By room this month</h2>
        <ul id="summary-rooms" class="room-list"></ul>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button type="button" class="nav-btn nav-btn--active" data-screen="entry" aria-current="page">
      <span class="nav-pill"><i class="ti ti-plus nav-icon" aria-hidden="true"></i></span>
      <span class="nav-label">Entry</span>
    </button>
    <button type="button" class="nav-btn" data-screen="ledger">
      <span class="nav-pill"><i class="ti ti-list nav-icon" aria-hidden="true"></i></span>
      <span class="nav-label">Ledger</span>
    </button>
    <button type="button" class="nav-btn" data-screen="summary">
      <span class="nav-pill"><i class="ti ti-chart-bar nav-icon" aria-hidden="true"></i></span>
      <span class="nav-label">Summary</span>
    </button>
  </nav>

  <script src="config.js?v=3"></script>
  <script src="app.js?v=3"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js?v=3").catch(() => {});
      });
    }
  </script>
</body>
</html>
